# Black-box suite — a REQUIRED check, in its own workflow (DQ-3).
#
# The `main` ruleset requires two status checks by job name: `tests` (test.yml)
# and `blackbox` (this file). Two constraints follow from matching by name:
#
#   - The job must stay named `blackbox`. Renaming it leaves the ruleset
#     waiting on a check that never reports, which blocks every PR.
#   - `pull_request` must stay unfiltered (no `paths:` / `branches:`). A
#     required check whose workflow is skipped by a filter also never reports.
#
# It must also never define a job named `tests`, which the ruleset would read
# as the test.yml gate.
#
# Burn-in record: added 2026-08-27 as advisory-only, with promotion planned
# after roughly 2 weeks / ~50 PRs. By 2026-09-26 it had 50 runs: 48 passed and
# the other 2 were fork PRs whose workflows were never approved, so no job ran
# (every other `pull_request` workflow on those commits "failed" the same way).
# No test in this suite failed during burn-in. Promoted to required then.
name: Black-box

on:
  pull_request:

# No write anywhere in this job: it checks out a pull request, installs
# dependencies and runs a suite. Declared rather than inherited, so the job
# keeps its own floor even if the repository default is ever widened back to
# write. A fork PR's token is read-only regardless; this covers the branch
# runs, which are the ones that carry a real token.
permissions:
  contents: read

jobs:
  blackbox:
    name: blackbox
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11 # keep in step with test.yml

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Black-box typecheck
        run: bun run typecheck:blackbox

      # Issue #77, as in test.yml's Test step: harness-idle-timeout.test.ts
      # proves a harness call's setsid descendant (Claude Code's Bash tool
      # starts every command in a new session) dies with the call. Only a
      # cgroup can do that, and the runner's own cgroup belongs to root, so the
      # step creates one owned by the runner user and moves its shell into it
      # before the suite starts. CONDUIT_REQUIRE_CGROUP_CONTAINMENT makes that
      # journey fail, naming the `conduit doctor` line, instead of skipping the
      # assertion if the runner image ever stops allowing this.
      - name: Black-box test
        env:
          CONDUIT_REQUIRE_CGROUP_CONTAINMENT: '1'
        run: |
          cg=/sys/fs/cgroup/conduit-ci
          sudo mkdir -p "$cg"
          sudo chown -R "$(id -u):$(id -g)" "$cg"
          echo $$ | sudo tee "$cg/cgroup.procs" > /dev/null
          bun run test:blackbox
