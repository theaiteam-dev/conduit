# Prepare release: opens the release PR. See docs/releasing.md.
#
# Run by hand with the version to release. The job bumps package.json, moves
# the CHANGELOG "Unreleased" section under `## [X.Y.Z] - <today>` and opens a
# PR from release/vX.Y.Z. Merging that PR is what releases (release.yml).
#
# The PR is pushed and opened with a GitHub App token, not GITHUB_TOKEN, for
# two reasons: a PR opened with GITHUB_TOKEN triggers no workflows, so the
# required `tests` and `blackbox` checks would never report on it; and the
# repository does not allow Actions to create pull requests. The App needs
# Contents and Pull requests write on this repository. This job pushes only
# the release branch. A push to main with the token would be rejected anyway:
# the main ruleset requires a pull request and has no bypass actors.
name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, MAJOR.MINOR.PATCH with no leading v (e.g. 2.0.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Open the release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Mint the release App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # Full history for the tags: the prepare script compares the requested
      # version against the newest v* tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Test the release script
        run: bun test scripts/release.test.ts

      # The script validates the version (strict MAJOR.MINOR.PATCH, greater
      # than the newest tag and package.json) before anything below uses it in
      # a branch name or a shell word. It needs no dependencies, so no install.
      - name: Bump the version and roll the changelog
        env:
          VERSION: ${{ inputs.version }}
        run: bun scripts/release.ts prepare "$VERSION"

      - name: Push the release branch and open the PR
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          branch="release/v$VERSION"
          # --exit-code returns 2 only when the ref is absent; any other
          # failure (network, auth) must stop the job, not read as "absent".
          status=0
          git ls-remote --exit-code --heads origin "$branch" > /dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::Branch $branch already exists. Close its PR and delete the branch to prepare again."
            exit 1
          elif [ "$status" -ne 2 ]; then
            echo "::error::git ls-remote failed (exit $status) while checking for $branch."
            exit 1
          fi

          bot_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"

          # Everything that can fail runs before the push, so a failed run
          # leaves no release branch behind and can simply be run again.
          {
            echo "Release PR for **v$VERSION**, opened by the Prepare release workflow."
            echo
            echo "Merging tags \`v$VERSION\`, creates the GitHub release from the section below and publishes the \`conduit-engine\` image. Edit \`CHANGELOG.md\` on this branch to change the notes; see \`docs/releasing.md\`."
            echo
            echo "---"
            echo
            bun scripts/release.ts notes "$VERSION"
          } > "$RUNNER_TEMP/pr-body.md"

          git switch -c "$branch"
          git add package.json CHANGELOG.md
          git commit -m "chore(release): $VERSION"
          git push origin "$branch"

          gh pr create --base main --head "$branch" \
            --title "chore(release): $VERSION" \
            --body-file "$RUNNER_TEMP/pr-body.md"
